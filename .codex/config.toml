# Project-scoped Codex configuration for the central orchestration pack.
# Models and reasoning effort are deliberately unpinned so current Codex
# runtime defaults can advance without changing this repository.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = false

[apps._default]
approvals_reviewer = "user"
default_tools_approval_mode = "writes"
destructive_enabled = false
open_world_enabled = false

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
interrupt_message = true
max_concurrent_threads_per_session = 4

[agents.requirements_analyst]
description = "Klaert Ziel, Scope, Annahmen, Akzeptanzkriterien und gebuendelte Rueckfragen."
config_file = "agents/requirements_analyst.toml"
nickname_candidates = ["Videl"]

[agents.project_planner]
description = "Plant Meilensteine, Abhaengigkeiten, Reviewpunkte und risikoarme Reihenfolge."
config_file = "agents/project_planner.toml"
nickname_candidates = ["Shenron"]

[agents.code_mapper]
description = "Erkundet Codebase, Einstiegspunkte, Tests, Abhaengigkeiten und Risiken read-only."
config_file = "agents/code_mapper.toml"
nickname_candidates = ["Trunks"]

[agents.code_test_triage]
description = "Analysiert Testfehler, Logs und Stacktraces read-only."
config_file = "agents/code_test_triage.toml"
nickname_candidates = ["Android 17"]

[agents.code_simple_worker]
description = "Implementiert kleine, klar begrenzte Code- oder Textaenderungen mit Tests."
config_file = "agents/code_simple_worker.toml"
nickname_candidates = ["Goten"]

[agents.code_medium_worker]
description = "Implementiert normale Features und Bugfixes im zugewiesenen Scope."
