name: Preview GitHub Org Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-github-org
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preview milestones, labels, and optional protection
        env:
          GITHUB_REPO: ${{ github.repository }}
          DRY_RUN: "1"
          REQUIRE_BRANCH_PROTECTION: "0"
        run: ./scripts/bootstrap-github-org.sh
