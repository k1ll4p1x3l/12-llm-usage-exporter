name: Preview GitHub Org Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-github-org
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Preview milestones, labels, and optional protection
        env:
          GITHUB_REPO: ${{ github.repository }}
          DRY_RUN: "1"
          REQUIRE_BRANCH_PROTECTION: "0"
        run: ./scripts/bootstrap-github-org.sh
