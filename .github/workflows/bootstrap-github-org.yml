name: Bootstrap GitHub Org Metadata

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview planned changes without mutating GitHub data."
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: bootstrap-github-org
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Bootstrap milestones and labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          REQUIRE_BRANCH_PROTECTION: "0"
        run: ./scripts/bootstrap-github-org.sh
