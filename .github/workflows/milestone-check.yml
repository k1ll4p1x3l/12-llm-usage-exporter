name: Milestone Check

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-milestone:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require milestone on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pull = context.payload.pull_request;
            const labels = new Set((pull.labels || []).map((label) => label.name));
            const managedDependencyUpdate =
              pull.user?.login === "dependabot[bot]" && labels.has("dependencies");

            if (managedDependencyUpdate) {
              core.info("Milestone check bypassed for a labeled Dependabot dependency update.");
              return;
            }

            const { owner, repo } = context.repo;
            const { data: currentPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pull.number,
            });

            if (currentPull.milestone == null) {
              core.setFailed("Assign a GitHub milestone to the pull request before merge.");
            }
